<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Prix Net Perros - Multi-Plateforme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1, h2, h3, h4 {
            color: #4CAF50;
        }
        h1 {
            text-align: center;
            margin-top: 0;
        }
        label {
            font-size: 16px;
            margin-top: 15px;
            display: block;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .result h3 {
            margin-top: 15px;
            margin-bottom: 8px;
        }
        .highlight {
            color: red;
            font-weight: bold;
        }
        .highlight-green {
            color: green;
            font-weight: bold;
        }
        .highlight-orange {
            color: orange;
            font-weight: bold;
        }
        .highlight-blue {
            color: blue;
            font-weight: bold;
        }
        hr {
            margin: 12px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
        .recap {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .recap h4 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calcul du Prix Net - Perros</h1>

        <label for="plateforme">Plateforme :</label>
        <select id="plateforme">
            <option value="booking">Booking</option>
            <option value="airbnb">Airbnb</option>
            <option value="direct">Direct</option>
        </select>

        <label for="prixTTC2p">Prix TTC pour 2 personnes (sans annulation) :</label>
        <input type="number" id="prixTTC2p" step="0.01" placeholder="Ex: 85.00">

        <button onclick="calculer()">Calculer</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        // ---------- CONFIG / CONSTANTES ----------
        const VILLE = "Perros";
        const tauxTaxe = 0.05;
        const plafondTaxe = 4.20;
        const tauxTaxeDepartementale = 0.10;
        const commissionHoteAirbnb = 0.155; // 15.5%
        const commissionVoyageurAirbnb = 0.1605; // 16.05%
        const commissionBooking = 0.17;
        const commissionCB = 0.014; // 1.4%

        // Utilitaires
        function round2(x) {
            return Math.round((x + Number.EPSILON) * 100) / 100;
        }
        function ceilInt(x) {
            return Math.ceil(x);
        }
        function floorInt(x) {
            return Math.floor(x);
        }

        // Calcul taxe de séjour
        function taxeSejourPourPrix(prixNet, adultes = 1) {
            let taxeBrute = prixNet * tauxTaxe;
            if (taxeBrute >= adultes * plafondTaxe) taxeBrute = adultes * plafondTaxe;
            const taxeFinale = round2(taxeBrute * (1 + tauxTaxeDepartementale));
            return {
                taxeBrute: round2(taxeBrute),
                taxeFinale: taxeFinale
            };
        }

        // ---------- FONCTION PRINCIPALE ----------
        function calculer() {
            const prixTTC2p = parseFloat(document.getElementById("prixTTC2p").value);
            const plateforme = document.getElementById("plateforme").value.toLowerCase();

            if (isNaN(prixTTC2p) || prixTTC2p <= 0) {
                alert("Veuillez entrer un prix TTC valide pour 2 personnes sans annulation.");
                return;
            }

            let details = "";
            const resultDiv = document.getElementById("result");

            // -------------------------
            //        BOOKING
            // -------------------------
            if (plateforme === "booking") {
                // Calcul prix net 2p (sans annulation)
                let prixNet2p = prixTTC2p / (1 + tauxTaxe + tauxTaxe * tauxTaxeDepartementale);
                let taxe2pInfo = taxeSejourPourPrix(prixNet2p, 2);
                let taxeSejour2p = taxe2pInfo.taxeFinale;

                // Application du plafond si nécessaire
                let taxeBrute2p = taxe2pInfo.taxeBrute;
                if (taxeBrute2p >= 2 * plafondTaxe) {
                    prixNet2p = prixTTC2p - (2 * plafondTaxe * (1 + tauxTaxeDepartementale));
                    prixNet2p = round2(prixNet2p);
                    taxe2pInfo = taxeSejourPourPrix(prixNet2p, 2);
                    taxeSejour2p = taxe2pInfo.taxeFinale;
                } else {
                    prixNet2p = round2(prixNet2p);
                }

                // Cas avec annulation
                const prixNet2pAnnul = round2(prixNet2p / 0.9);
                const prixNet4pAnnul = round2(prixNet2pAnnul / 0.85);

                // Taxes
                const taxe2pAnnulInfo = taxeSejourPourPrix(prixNet2pAnnul, 2);
                const taxe2pAnnul = taxe2pAnnulInfo.taxeFinale;
                const taxe4pInfo = taxeSejourPourPrix(prixNet4pAnnul, 4);
                const taxe4p = taxe4pInfo.taxeFinale;

                // Prix brut Booking
                const prixBrutBooking = round2(prixNet2p + taxeSejour2p);
                const prixBrutBookingAnnul = round2(prixNet2pAnnul + taxe2pAnnul);

                // Commission Booking
                const commissionBookingEuro = round2(prixNet2p * (commissionBooking + commissionCB));
                const commissionBookingEuroAnnul = round2(prixNet2pAnnul * (commissionBooking + commissionCB));

                // Prix net après commission Booking
                const prixSansCommissionBooking = round2(prixNet2p - commissionBookingEuro);
                const prixSansCommissionBookingAnnul = round2(prixNet2pAnnul - commissionBookingEuroAnnul);

                // Prix client final Booking
                const prixClientFinalBooking = round2(prixBrutBooking * (1 + commissionVoyageurAirbnb));
                const prixClientFinalBookingAnnul = round2(prixBrutBookingAnnul * (1 + commissionVoyageurAirbnb));

                // Équivalent Airbnb (prix net reçu identique à Booking)
                const coefAirbnb = 1 - commissionHoteAirbnb;
                const prixAEntrerEquivalentAirbnb = round2(prixSansCommissionBooking / coefAirbnb);
                const prixAEntrerEquivalentAirbnbAnnul = round2(prixSansCommissionBookingAnnul / coefAirbnb);

                // Arrondis supérieurs
                const prixAEntrerAirbnbBrutArrondi = ceilInt(prixAEntrerEquivalentAirbnb);
                const prixAEntrerAirbnbBrutAnnulArrondi = ceilInt(prixAEntrerEquivalentAirbnbAnnul);

                // **CALCULS POUR LE CAS AVEC ANNULATION**
                const prixAirbnbAvecAnnulArrondi = prixAEntrerAirbnbBrutAnnulArrondi;
                const montantHoteAvecAnnul = round2(prixAirbnbAvecAnnulArrondi * (1 - commissionHoteAirbnb));
                const taxeInfoAvecAnnul = taxeSejourPourPrix(prixAirbnbAvecAnnulArrondi, 2);
                // CORRECTION : Prix client final Airbnb = Prix Airbnb + Taxe finale (sans ajouter commission voyageur)
                const prixClientFinalAirbnbAvecAnnul = round2(prixAirbnbAvecAnnulArrondi + taxeInfoAvecAnnul.taxeFinale);

                // **CALCULS POUR LE CAS SANS ANNULATION (à partir du prix avec annulation - 10%)**
                const prixAirbnbSansAnnulArrondi = round2(prixAirbnbAvecAnnulArrondi * 0.90);
                const montantHoteSansAnnul = round2(prixAirbnbSansAnnulArrondi * (1 - commissionHoteAirbnb));
                const taxeInfoSansAnnul = taxeSejourPourPrix(prixAirbnbSansAnnulArrondi, 2);
                // CORRECTION : Prix client final Airbnb = Prix Airbnb sans annulation + Taxe finale
                const prixClientFinalAirbnbSansAnnul = round2(prixAirbnbSansAnnulArrondi + taxeInfoSansAnnul.taxeFinale);

                // **RÉCAPITULATIF COMPLET**
                details = `
                    <h3>Détails Booking</h3>
                    <p><strong>Prix net 2P (sans commission Booking) :</strong> €${prixSansCommissionBooking.toFixed(2)}</p>
                    <p><strong>Commission Booking (${(commissionBooking*100).toFixed(0)}% + CB) :</strong> €${commissionBookingEuro.toFixed(2)}</p>
                    <hr>
                    <p>Prix net 2P (avec commission Booking) : €${prixNet2p.toFixed(2)}</p>
                    <p>Taxe de séjour 2P : €${taxeSejour2p.toFixed(2)}</p>
                    <hr>
                    <p>Prix net 2P avec annulation (/0.9) : €${prixNet2pAnnul.toFixed(2)}</p>
                    <p>Taxe de séjour 2P : €${taxe2pAnnul.toFixed(2)}</p>
                    <p>Prix brut 2P avec annulation : €${prixBrutBookingAnnul.toFixed(2)}</p>
                    <p>Prix net 4P avec annulation (/0.85) : €${prixNet4pAnnul.toFixed(2)}</p>
                    <p>Taxe de séjour 4P : €${taxe4p.toFixed(2)}</p>
                    <hr>
                    <p><strong>Prix à entrer sous Booking :</strong> <span class="highlight">€${prixNet4pAnnul.toFixed(2)}</span></p>
                    <hr>
                    <p><strong>Prix client final (affiché sur Booking) :</strong> €${prixClientFinalBooking.toFixed(2)}</p>

                    <hr>
                    <h3>➡️ Récapitulatif complet des calculs Airbnb</h3>

                    <div class="recap">
                        <h4>Avec annulation</h4>
                        <p><strong>Prix arrondi brut :</strong> <span class="highlight-orange">€${prixAirbnbAvecAnnulArrondi.toFixed(2)}</span></p>
                        <p><strong>Montant hôte (sans commission Airbnb) :</strong> <span class="highlight-green">€${montantHoteAvecAnnul.toFixed(2)}</span></p>
                        <p><strong>Taxe brute :</strong> €${taxeInfoAvecAnnul.taxeBrute.toFixed(2)}</p>
                        <p><strong>Taxe finale :</strong> €${taxeInfoAvecAnnul.taxeFinale.toFixed(2)}</p>
                        <p><strong>Prix client final Airbnb :</strong> <span class="highlight-blue">€${prixClientFinalAirbnbAvecAnnul.toFixed(2)}</span></p>
                    </div>

                    <div class="recap">
                        <h4>Sans annulation (prix avec annulation - 10%)</h4>
                        <p><strong>Prix Airbnb sans annulation :</strong> <span class="highlight-blue">€${prixAirbnbSansAnnulArrondi.toFixed(2)}</span></p>
                        <p><strong>Montant hôte (sans commission Airbnb) :</strong> <span class="highlight-green">€${montantHoteSansAnnul.toFixed(2)}</span></p>
                        <p><strong>Taxe brute :</strong> €${taxeInfoSansAnnul.taxeBrute.toFixed(2)}</p>
                        <p><strong>Taxe finale :</strong> €${taxeInfoSansAnnul.taxeFinale.toFixed(2)}</p>
                        <p><strong>Prix client final Airbnb :</strong> <span class="highlight">€${prixClientFinalAirbnbSansAnnul.toFixed(2)}</span></p>
                    </div>
                `;
            }

            // -------------------------
            //        AIRBNB
            // -------------------------
            if (plateforme === "airbnb") {
                const prixClient2p = prixTTC2p;
                const prixHote2pTTC = prixClient2p / (1 + commissionVoyageurAirbnb);
                let prixNet2pAirbnb = prixHote2pTTC / (1 + tauxTaxe + tauxTaxe * tauxTaxeDepartementale);

                let taxeSejour2pAirbnb = prixNet2pAirbnb * tauxTaxe;
                if (taxeSejour2pAirbnb >= 2 * plafondTaxe) {
                    prixNet2pAirbnb = prixHote2pTTC - (2 * plafondTaxe * (1 + tauxTaxeDepartementale));
                }

                // Arrondi supérieur (avec annulation)
                const prixAEntrerSup = ceilInt(prixNet2pAirbnb);
                let taxeBruteSup = prixAEntrerSup * tauxTaxe;
                if (taxeBruteSup >= 2 * plafondTaxe) taxeBruteSup = 2 * plafondTaxe;
                const taxeSup = round2(taxeBruteSup * (1 + tauxTaxeDepartementale));
                const commissionHoteSup = round2(prixAEntrerSup * commissionHoteAirbnb * 1.20);
                const prixClientFinalSup = round2((prixAEntrerSup + taxeSup) * (1 + commissionVoyageurAirbnb));
                const prixSansCommissionSup = round2(prixAEntrerSup - commissionHoteSup);

                // **CALCULS POUR LE CAS AVEC ANNULATION (arrondi supérieur)**
                const montantHoteAvecAnnulSup = round2(prixAEntrerSup * (1 - commissionHoteAirbnb));
                // CORRECTION : Prix client final Airbnb = Prix Airbnb + Taxe finale
                const prixClientFinalAirbnbAvecAnnulSup = round2(prixAEntrerSup + taxeSup);

                // **CALCULS POUR LE CAS SANS ANNULATION (à partir du prix avec annulation - 10%)**
                const prixAirbnbSansAnnulSup = round2(prixAEntrerSup * 0.90);
                const montantHoteSansAnnulSup = round2(prixAirbnbSansAnnulSup * (1 - commissionHoteAirbnb));
                const taxeInfoSansAnnulSup = taxeSejourPourPrix(prixAirbnbSansAnnulSup, 2);
                // CORRECTION : Prix client final Airbnb = Prix Airbnb sans annulation + Taxe finale
                const prixClientFinalAirbnbSansAnnulSup = round2(prixAirbnbSansAnnulSup + taxeInfoSansAnnulSup.taxeFinale);

                // Arrondi inférieur (avec annulation)
                const prixAEntrerInf = floorInt(prixNet2pAirbnb);
                let taxeBruteInf = prixAEntrerInf * tauxTaxe;
                if (taxeBruteInf >= 2 * plafondTaxe) taxeBruteInf = 2 * plafondTaxe;
                const taxeInf = round2(taxeBruteInf * (1 + tauxTaxeDepartementale));
                const commissionHoteInf = round2(prixAEntrerInf * commissionHoteAirbnb * 1.20);
                const prixClientFinalInf = round2((prixAEntrerInf + taxeInf) * (1 + commissionVoyageurAirbnb));
                const prixSansCommissionInf = round2(prixAEntrerInf - commissionHoteInf);

                // **CALCULS POUR LE CAS AVEC ANNULATION (arrondi inférieur)**
                const montantHoteAvecAnnulInf = round2(prixAEntrerInf * (1 - commissionHoteAirbnb));
                // CORRECTION : Prix client final Airbnb = Prix Airbnb + Taxe finale
                const prixClientFinalAirbnbAvecAnnulInf = round2(prixAEntrerInf + taxeInf);

                // **CALCULS POUR LE CAS SANS ANNULATION (à partir du prix avec annulation - 10%)**
                const prixAirbnbSansAnnulInf = round2(prixAEntrerInf * 0.90);
                const montantHoteSansAnnulInf = round2(prixAirbnbSansAnnulInf * (1 - commissionHoteAirbnb));
                const taxeInfoSansAnnulInf = taxeSejourPourPrix(prixAirbnbSansAnnulInf, 2);
                // CORRECTION : Prix client final Airbnb = Prix Airbnb sans annulation + Taxe finale
                const prixClientFinalAirbnbSansAnnulInf = round2(prixAirbnbSansAnnulInf + taxeInfoSansAnnulInf.taxeFinale);

                details = `
                    <h3>Détails Airbnb</h3>
                    <p><strong>Prix client saisi (2P) :</strong> €${prixClient2p.toFixed(2)}</p>
                    <p><strong>Prix net hôte (avant arrondi) :</strong> €${prixNet2pAirbnb.toFixed(2)}</p>
                    <hr>

                    <div class="recap">
                        <h4>Option 1 : Arrondi supérieur</h4>
                        <p><strong>Prix à entrer (avec annulation) :</strong> <span class="highlight-orange">€${prixAEntrerSup.toFixed(2)}</span></p>
                        <p><strong>Montant hôte (avec annulation) :</strong> <span class="highlight-green">€${montantHoteAvecAnnulSup.toFixed(2)}</span></p>
                        <p>Taxe séjour : €${taxeSup.toFixed(2)}</p>
                        <p>Commission hôte : €${commissionHoteSup.toFixed(2)}</p>
                        <p>Prix sans commission : €${prixSansCommissionSup.toFixed(2)}</p>
                        <p><strong>Prix client final (avec annulation) :</strong> <span class="highlight-blue">€${prixClientFinalAirbnbAvecAnnulSup.toFixed(2)}</span></p>
                        <hr>
                        <p><strong>Prix Airbnb sans annulation (prix avec annulation - 10%) :</strong> <span class="highlight-blue">€${prixAirbnbSansAnnulSup.toFixed(2)}</span></p>
                        <p><strong>Montant hôte (sans annulation) :</strong> <span class="highlight-green">€${montantHoteSansAnnulSup.toFixed(2)}</span></p>
                        <p><strong>Taxe brute :</strong> €${taxeInfoSansAnnulSup.taxeBrute.toFixed(2)}</p>
                        <p><strong>Taxe finale :</strong> €${taxeInfoSansAnnulSup.taxeFinale.toFixed(2)}</p>
                        <p><strong>Prix client final Airbnb (sans annulation) :</strong> <span class="highlight">€${prixClientFinalAirbnbSansAnnulSup.toFixed(2)}</span></p>
                    </div>

                    <div class="recap">
                        <h4>Option 2 : Arrondi inférieur</h4>
                        <p><strong>Prix à entrer (avec annulation) :</strong> <span class="highlight-orange">€${prixAEntrerInf.toFixed(2)}</span></p>
                        <p><strong>Montant hôte (avec annulation) :</strong> <span class="highlight-green">€${montantHoteAvecAnnulInf.toFixed(2)}</span></p>
                        <p>Taxe séjour : €${taxeInf.toFixed(2)}</p>
                        <p>Commission hôte : €${commissionHoteInf.toFixed(2)}</p>
                        <p>Prix sans commission : €${prixSansCommissionInf.toFixed(2)}</p>
                        <p><strong>Prix client final (avec annulation) :</strong> <span class="highlight-blue">€${prixClientFinalAirbnbAvecAnnulInf.toFixed(2)}</span></p>
                        <hr>
                        <p><strong>Prix Airbnb sans annulation (prix avec annulation - 10%) :</strong> <span class="highlight-blue">€${prixAirbnbSansAnnulInf.toFixed(2)}</span></p>
                        <p><strong>Montant hôte (sans annulation) :</strong> <span class="highlight-green">€${montantHoteSansAnnulInf.toFixed(2)}</span></p>
                        <p><strong>Taxe brute :</strong> €${taxeInfoSansAnnulInf.taxeBrute.toFixed(2)}</p>
                        <p><strong>Taxe finale :</strong> €${taxeInfoSansAnnulInf.taxeFinale.toFixed(2)}</p>
                        <p><strong>Prix client final Airbnb (sans annulation) :</strong> <span class="highlight">€${prixClientFinalAirbnbSansAnnulInf.toFixed(2)}</span></p>
                    </div>
                `;
            }

            // -------------------------
            //        DIRECT
            // -------------------------
            if (plateforme === "direct") {
                let prixNet4p = prixTTC2p;
                let taxe2p = taxeSejourPourPrix(prixNet4p, 2).taxeFinale;
                let prixFinal = round2(prixNet4p + taxe2p);

                details = `
                    <h3>Détails Direct</h3>
                    <p><strong>Prix net hôte (2P) => Prix à entrer sous Direct :</strong> <span class="highlight">€${prixNet4p.toFixed(2)}</span></p>
                    <p>Taxe de séjour 2P : €${taxe2p.toFixed(2)}</p>
                    <hr>
                    <p>Aucune commission appliquée.</p>
                    <p><strong>Prix client final (affiché direct) :</strong> €${prixFinal.toFixed(2)}</p>
                `;
            }

            resultDiv.innerHTML = details;
        }
    </script>
</body>
</html>
