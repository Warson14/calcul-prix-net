<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Prix Net Perros - Multi-Plateforme</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-top: 0;
        }
        label {
            font-size: 16px;
            margin-top: 15px;
            display: block;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .result h3 {
            margin-top: 15px;
            margin-bottom: 8px;
        }
        .highlight {
            color: red;
            font-weight: bold;
        }
        hr {
            margin: 12px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Calcul du Prix Net - Perros</h1>

    <label for="plateforme">Plateforme :</label>
    <select id="plateforme">
        <option value="booking">Booking</option>
        <option value="airbnb">Airbnb</option>
        <option value="direct">Direct</option>
    </select>

    <label for="prixTTC2p">Prix TTC pour 2 personnes (sans annulation) :</label>
    <input type="number" id="prixTTC2p" step="0.01">

    <button onclick="calculer()">Calculer</button>

    <div class="result" id="result"></div>
</div>

<script>
    const VILLE = "Perros";

    const tauxTaxe = 0.05;
    const plafondTaxe = 4.20;
    const tauxTaxeDepartementale = 0.10;

    // 🔥 Commission Airbnb centralisée ici (source unique pour Booking ET Airbnb)
    const commissionHoteAirbnb = 0.155; // 15.5%
    const tvaAirbnb = 1.20;

    function taxeSejour(prixNet, adultes) {
        let taxe = prixNet * tauxTaxe;
        taxe = Math.min(taxe, adultes * plafondTaxe);
        return taxe + taxe * tauxTaxeDepartementale;
    }

    // Calcul Airbnb "moderne" : commission hôte + taxe ajoutée par-dessus,
    // sans frais voyageur séparé (même logique que Booking)
    function calculAirbnb(prixEntrer) {
        const taxe = taxeSejour(prixEntrer, 2);
        const commissionEuro = prixEntrer * commissionHoteAirbnb * tvaAirbnb;
        const prixSansCommission = prixEntrer - commissionEuro;
        const prixClientFinal = prixEntrer + taxe;
        return { prixEntrer, taxe, commissionEuro, prixSansCommission, prixClientFinal };
    }

    function calculer() {
        const prixTTC2p = parseFloat(document.getElementById("prixTTC2p").value);
        const plateforme = document.getElementById("plateforme").value.toLowerCase();

        if (isNaN(prixTTC2p) || prixTTC2p <= 0) {
            alert("Veuillez entrer un prix TTC valide pour 2 personnes sans annulation.");
            return;
        }

        let prixNet2p = prixTTC2p / (1 + tauxTaxe + tauxTaxe * tauxTaxeDepartementale);

        let taxeSejour2p = prixNet2p * tauxTaxe;

        if (taxeSejour2p >= 2 * plafondTaxe) {
            prixNet2p = prixTTC2p - (2 * plafondTaxe * (1 + tauxTaxeDepartementale));
        } else {
            prixNet2p = prixTTC2p / (1 + tauxTaxe + tauxTaxe * tauxTaxeDepartementale);
        }

        let prixNet4p = prixNet2p;
        let prixFinal;
        let details = "";

        // -------------------------
        //       BOOKING
        // -------------------------
        if (plateforme === "booking") {

            let prixNet2pAnnul = prixNet2p / 0.9;
            let prixNet4pAnnul = prixNet2pAnnul / 0.85;

            prixFinal = prixNet4pAnnul;

            let taxe2p = taxeSejour(prixNet2p, 2);
            let taxe2pAnnul = taxeSejour(prixNet2pAnnul, 2);
            let taxe4p = taxeSejour(prixFinal, 4);
            let prixBrut2pAnnul = prixNet2pAnnul + taxe2pAnnul;

            const prixClientFinal = (prixNet2p + taxe2p);

            const commissionBooking = 0.17;

            let commissionBookingEuro = prixNet2p * (commissionBooking + 0.014);
            let commissionBookingEuroAnnul = prixNet2pAnnul * (commissionBooking + 0.014);

            let prixSansCommission = prixNet2p - commissionBookingEuro;
            let prixSansCommissionAnnul = prixNet2pAnnul - commissionBookingEuroAnnul;

            // -------------------------------------------------------
            // Équivalent Airbnb (logique alignée : commission 15.5%,
            // pas de frais voyageur, taxe ajoutée par-dessus)
            // -------------------------------------------------------

            const coefAirbnb = 1 - (commissionHoteAirbnb * tvaAirbnb);

            // Équivalent Airbnb à prix NET reçu identique à Booking (sans annulation)
            const prixAEntrerEquivalentAirbnb = prixSansCommission / coefAirbnb;
            const eqNet = calculAirbnb(prixAEntrerEquivalentAirbnb);

            // Équivalent Airbnb à prix NET reçu identique à Booking (avec annulation)
            const prixAEntrerEquivalentAirbnbAnnul = prixSansCommissionAnnul / coefAirbnb;
            const eqNetAnnul = calculAirbnb(prixAEntrerEquivalentAirbnbAnnul);

            // Équivalent Airbnb à prix client BRUT identique à Booking (avec annulation)
            // (résolution directe, plus besoin d'itération : la relation est linéaire
            //  sauf si la taxe est plafonnée)
            function prixAirbnbPourBrutCible(brutCible) {
                // Hypothèse non plafonnée
                let guess = brutCible / (1 + tauxTaxe * (1 + tauxTaxeDepartementale));
                let taxeTest = taxeSejour(guess, 2);
                if (taxeTest >= 2 * plafondTaxe * (1 + tauxTaxeDepartementale) - 1e-9) {
                    // Cas plafonné : taxe fixe
                    guess = brutCible - (2 * plafondTaxe * (1 + tauxTaxeDepartementale));
                }
                return guess;
            }

            const prixBrutBookingAnnul = prixNet2pAnnul + taxe2pAnnul;

            // Prix Airbnb "avec annulation" (seul point de départ nécessaire)
            const prixAEntrerAirbnbBrutAnnul = prixAirbnbPourBrutCible(prixBrutBookingAnnul);
            const eqBrutAnnul = calculAirbnb(prixAEntrerAirbnbBrutAnnul);
            const prixAEntrerAirbnbBrutAnnulArrondi = Math.ceil(prixAEntrerAirbnbBrutAnnul);
            const eqBrutAnnulArrondi = calculAirbnb(prixAEntrerAirbnbBrutAnnulArrondi);

            // Prix Airbnb "sans annulation" = prix avec annulation (arrondi) - 10%
            const prixSansAnnulAirbnb = prixAEntrerAirbnbBrutAnnulArrondi * 0.9;
            const eqSansAnnul = calculAirbnb(prixSansAnnulAirbnb);

            details = `
                <h3>Détails Booking</h3>
                <p><strong>Prix net 2P (sans commission Booking) :</strong> €${prixSansCommission.toFixed(2)}</p>
                <p><strong>Commission Booking (${(commissionBooking*100).toFixed(0)}% + CB) :</strong> €${commissionBookingEuro.toFixed(2)}</p>
                <hr>
                <p>Prix net 2P (avec commission Booking) : €${prixNet2p.toFixed(2)}</p>
                <p>Taxe de séjour 2P : €${taxe2p.toFixed(2)}</p>
                <hr>
                <p>Prix net 2P avec annulation (/0.9) : €${prixNet2pAnnul.toFixed(2)}</p>
                <p>Taxe de séjour 2P : €${taxe2pAnnul.toFixed(2)}</p>
                <p>Prix brut 2P avec annulation (/0.9) : €${prixBrut2pAnnul.toFixed(2)}</p>
                <p>Prix net 4P avec annulation (/0.85) : €${prixNet4pAnnul.toFixed(2)}</p>
                <p>Taxe de séjour 4P : €${taxe4p.toFixed(2)}</p>
                <hr>
                <p><strong>Prix à entrer sous Booking :</strong> <span style="color: red; font-weight: bold;">€${prixNet4pAnnul.toFixed(2)}</span></p>
                <hr>
                <p><strong>Prix client final (affiché sur Booking) :</strong> €${prixClientFinal.toFixed(2)}</p>

                <hr>
                <h4>➡️ Équivalent Airbnb (prix client BRUT identique à Booking)</h4>

                <p><strong>Avec annulation :</strong></p>
                <p>Prix brut Booking : €${prixBrutBookingAnnul.toFixed(2)}</p>
                <p>Prix à entrer sur Airbnb : <strong>€${prixAEntrerAirbnbBrutAnnul.toFixed(2)}</strong></p>
                <p>Prix à entrer sur Airbnb (Arrondi SUP): <span style="color: red; font-weight: bold;">€${prixAEntrerAirbnbBrutAnnulArrondi.toFixed(2)}</span></p>
                <p>Commission hôte Airbnb (15.5%) : €${eqBrutAnnulArrondi.commissionEuro.toFixed(2)}</p>
                <p>Prix net Airbnb sans commission : €${eqBrutAnnulArrondi.prixSansCommission.toFixed(2)}</p>
                <p>Prix client final Airbnb : €${eqBrutAnnul.prixClientFinal.toFixed(2)}</p>
                <p><strong>Prix client final sur Airbnb (Arrondi SUP):</strong> €${eqBrutAnnulArrondi.prixClientFinal.toFixed(2)}</p>

                <hr>
                <p><strong>Sans annulation (= arrondi avec annulation − 10%) :</strong></p>
                <p>Prix à entrer sur Airbnb : <span style="color: orange; font-weight: bold;">€${prixSansAnnulAirbnb.toFixed(2)}</span> (= €${prixAEntrerAirbnbBrutAnnulArrondi.toFixed(2)} − 10%)</p>
                <p>Commission hôte Airbnb (15.5%) : €${eqSansAnnul.commissionEuro.toFixed(2)}</p>
                <p>Prix net Airbnb sans commission : €${eqSansAnnul.prixSansCommission.toFixed(2)}</p>
                <p><strong>Prix client final sur Airbnb :</strong> €${eqSansAnnul.prixClientFinal.toFixed(2)}</p>

                <hr>
                <h4>➡️ Équivalent Airbnb (prix Net reçu identique à Booking) </h4>

                <p><strong>Sans annulation :</strong></p>
                <p>Prix net souhaité (même que Booking) : €${prixSansCommission.toFixed(2)}</p>
                <p><strong>Prix à entrer sur Airbnb pour toucher la même somme :</strong> <span style="color: green; font-weight: bold;">€${prixAEntrerEquivalentAirbnb.toFixed(2)}</span></p>
                <p>Prix net Airbnb sans commission (obtenu) : €${eqNet.prixSansCommission.toFixed(2)}</p>
                <p><strong>Prix client final sur Airbnb :</strong> €${eqNet.prixClientFinal.toFixed(2)}</p>

                <hr>
                <p><strong>Avec annulation :</strong></p>
                <p>Prix net souhaité (même que Booking) : €${prixSansCommissionAnnul.toFixed(2)}</p>
                <p><strong>Prix à entrer sur Airbnb pour toucher la même somme :</strong> <span style="color: green; font-weight: bold;">€${prixAEntrerEquivalentAirbnbAnnul.toFixed(2)}</span></p>
                <p>Prix net Airbnb sans commission (obtenu) : €${eqNetAnnul.prixSansCommission.toFixed(2)}</p>
                <p><strong>Prix client final sur Airbnb :</strong> €${eqNetAnnul.prixClientFinal.toFixed(2)}</p>
            `;
        }

        // -------------------------
        //        AIRBNB (2P)
        // -------------------------
        if (plateforme === "airbnb") {

            const prixStandardBrut = prixNet2p / 0.9;

            const prixStandardSup = Math.ceil(prixStandardBrut);
            const prixStandardInf = Math.floor(prixStandardBrut);

            function calculOption(prixStandardArrondi) {
                const standard = calculAirbnb(prixStandardArrondi);
                const prixSansAnnul = prixStandardArrondi * 0.9;
                const sansAnnul = calculAirbnb(prixSansAnnul);
                return { standard, sansAnnul, prixStandardArrondi };
            }

            const optionSup = calculOption(prixStandardSup);
            const optionInf = calculOption(prixStandardInf);

            function afficherOption(label, opt) {
                return `
                    <h4>${label} : ${opt.prixStandardArrondi} €</h4>
                    <p><strong>Tarif standard (avec annulation possible)</strong></p>
                    <p>Prix à entrer : <strong>${opt.prixStandardArrondi} €</strong></p>
                    <p>Taxe de séjour : €${opt.standard.taxe.toFixed(2)}</p>
                    <p>Commission hôte (${(commissionHoteAirbnb * 100).toFixed(1)}%) : €${opt.standard.commissionEuro.toFixed(2)}</p>
                    <p>Prix net hôte (sans commission) : €${opt.standard.prixSansCommission.toFixed(2)}</p>
                    <p><strong>Prix client final :</strong> €${opt.standard.prixClientFinal.toFixed(2)}</p>
                    <p style="margin-top:10px;"><strong>➡️ Tarif sans annulation généré automatiquement (-10%)</strong></p>
                    <p>Prix résultant : €${opt.sansAnnul.prixEntrer.toFixed(2)} (= ${opt.prixStandardArrondi} € − 10%)</p>
                    <p>Taxe de séjour : €${opt.sansAnnul.taxe.toFixed(2)}</p>
                    <p>Commission hôte : €${opt.sansAnnul.commissionEuro.toFixed(2)}</p>
                    <p>Prix net hôte (sans commission) : €${opt.sansAnnul.prixSansCommission.toFixed(2)}</p>
                    <p><strong>Prix client final sans annulation :</strong> <span style="color: red; font-weight: bold;">€${opt.sansAnnul.prixClientFinal.toFixed(2)}</span></p>
                `;
            }

            details = `
                <h3>Détails Airbnb</h3>
                <p>Prix standard avant arrondi : €${prixStandardBrut.toFixed(2)}</p>
                <hr>
                ${afficherOption("Option 1 : Arrondi supérieur", optionSup)}
                <hr>
                ${afficherOption("Option 2 : Arrondi inférieur", optionInf)}
            `;
        }

        // -------------------------
        //        DIRECT (2P)
        // -------------------------
        if (plateforme === "direct") {

            let taxe2p = taxeSejour(prixNet4p, 2);
            prixFinal = prixNet4p + taxe2p;

            details = `
                <h3>Détails Direct</h3>
                <p><strong>Prix net hôte (2P) => Prix à entrer sous Direct :</strong> <span class="highlight">€${prixNet4p.toFixed(2)}</span></p>
                <p>Taxe de séjour 2P : €${taxe2p.toFixed(2)}</p>
                <hr>
                <p>Aucune commission appliquée.</p>
                <p><strong>Prix client final (affiché direct):</strong> €${prixFinal.toFixed(2)}</p>
            `;
        }

        document.getElementById("result").innerHTML = `
            <hr>
            ${details}
        `;
    }
</script>

</body>
</html>
